name: Test Telegram

"on":
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Send test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 -c "from telegram_alert import send_telegram_message as s; ok = s('Test message from GitHub Actions -- if you see this, your Telegram setup works!'); print('Sent OK' if ok else 'FAILED to send -- check your secrets')"
