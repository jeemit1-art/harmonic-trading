name: Harmonic Scanner

# Runs the scanner automatically every hour, plus lets you trigger it
# manually from the Actions tab for testing. No server, no VM -- this runs
# entirely on GitHub's own machines, free.
"on":
  schedule:
    - cron: '0 * * * *'   # every hour, on the hour (UTC). Edit this to change frequency.
  workflow_dispatch: {}    # adds a "Run workflow" button in the Actions tab

# Needed so this workflow can commit the updated trade_state.json /
# leaderboard.json files back to the repo after each run -- that's how
# the scanner remembers what it already alerted on between runs, since
# each run otherwise starts from a completely fresh checkout.
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scanner.py

      - name: Save updated trade state back to the repo
        run: |
          git config user.name "harmonic-scanner-bot"
          git config user.email "actions@github.com"
          git add trade_state.json leaderboard.json alerted_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes to commit this run."
          else
            git commit -m "Update scanner state [skip ci]"
            git pull --rebase origin HEAD
            git push
            echo "State persisted successfully."
          fi
